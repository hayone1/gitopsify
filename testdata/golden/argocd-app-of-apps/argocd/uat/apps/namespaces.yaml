apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uat-namespaces
  namespace: argocd
  labels:
    gitopsify.io/app: namespaces
    gitopsify.io/env: uat
    gitopsify.io/wave: w-20
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  destination:
    server: https://uat.example.com:6443
  project: gitopsify-uat
  source:
    path: apps/namespaces/envs/uat
    repoURL: https://github.com/acme/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - ServerSideApply=true
