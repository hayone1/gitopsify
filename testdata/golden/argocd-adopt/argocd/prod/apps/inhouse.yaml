apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-inhouse
  namespace: argocd
  labels:
    gitopsify.io/app: inhouse
    gitopsify.io/env: prod
    gitopsify.io/wave: w0
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: tools
    server: https://kubernetes.default.svc
  project: gitopsify-prod
  sources:
    - helm:
        ignoreMissingValueFiles: true
        releaseName: inhouse
        valueFiles:
          - $values/apps/inhouse/base/values.yaml
          - $values/apps/inhouse/envs/prod/values.yaml
      path: apps/inhouse/charts/inhouse
      repoURL: https://github.com/acme/gitops.git
      targetRevision: main
    - ref: values
      repoURL: https://github.com/acme/gitops.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - ServerSideApply=true
      - ClientSideApplyMigration=false
