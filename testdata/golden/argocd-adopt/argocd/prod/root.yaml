apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitopsify-prod
  namespace: argocd
  labels:
    gitopsify.io/env: prod
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: argocd/prod/apps
    repoURL: https://github.com/acme/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
