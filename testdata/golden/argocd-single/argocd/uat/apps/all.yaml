apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uat-all
  namespace: argocd
  labels:
    gitopsify.io/env: uat
spec:
  destination:
    server: https://kubernetes.default.svc
  project: gitopsify-uat
  source:
    path: platform/argocd/uat/all
    repoURL: https://github.com/acme/gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
      - ServerSideApply=true
