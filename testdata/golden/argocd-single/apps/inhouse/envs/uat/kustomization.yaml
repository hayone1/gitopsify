apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: inhouse
    includeCRDs: true
    namespace: tools
    releaseName: inhouse
    valuesFile: values.yaml
    version: 0.1.0
helmGlobals:
  chartHome: ../../charts
patches:
  - patch: |
      apiVersion: v1
      kind: Any
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "0"
    target:
      name: .*
