apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: shop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  jobTemplate:
    metadata:
      name: cleanup
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              command:
                - echo
                - cleanup
              image: busybox:1.36
          restartPolicy: OnFailure
  schedule: 0 * * * *
