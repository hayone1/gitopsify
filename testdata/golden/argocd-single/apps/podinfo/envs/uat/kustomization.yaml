apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: podinfo
    includeCRDs: true
    namespace: podinfo
    releaseName: podinfo
    repo: https://stefanprodan.github.io/podinfo
    skipTests: true
    valuesFile: values.yaml
    version: 6.9.2
patches:
  - patch: |
      apiVersion: v1
      kind: Any
      metadata:
        name: any
        annotations:
          argocd.argoproj.io/sync-wave: "0"
    target:
      name: .*
