apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: payments
spec:
  template:
    spec:
      $setElementOrder/containers:
        - name: api
      containers:
        - name: api
          $setElementOrder/env:
            - name: ENDPOINT
          env:
            - name: ENDPOINT
              value: https://api.uat.example.com
