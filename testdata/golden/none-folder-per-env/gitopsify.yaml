# yaml-language-server: $schema=https://raw.githubusercontent.com/hayone1/gitopsify/main/docs/gitopsify.schema.json
# Generated by gitopsify test. Re-run `gitopsify generate -c gitopsify.yaml` to regenerate.
apiVersion: gitopsify.io/v1alpha1
kind: Migration
metadata:
  name: migration
spec:
  source: {}
  scope:
    includeDependencies: true
    clusterScoped: auto
  helm:
    mode: auto
    repositories:
      podinfo: https://stefanprodan.github.io/podinfo
    resolvers:
      - local
  clean:
    strategy: auto
  grouping:
    by: namespace
  ordering:
    enabled: true
    inferDependencies: true
  secrets:
    strategy: skip
    sops:
      encryptedRegex: ^(data|stringData)$
      decryptionSecret: sops-keys
    sealedSecrets:
      controllerNamespace: kube-system
      controllerName: sealed-secrets-controller
      scope: strict
    externalSecrets:
      apiVersion: external-secrets.io/v1
      storeKind: ClusterSecretStore
      storeName: default
      keyTemplate: '{{ .Namespace }}/{{ .Name }}'
      propertyPerKey: true
      refreshInterval: 1h
  output:
    tool: none
    layout: folder-per-env
    repo:
      revision: main
    argocd:
      pattern: app-of-apps
      namespace: argocd
      project: gitopsify
      version: v3.5.6
      autoSync: true
      selfHeal: true
      serverSideApply: true
    flux:
      namespace: flux-system
      interval: 10m
      version: v2.9.6
      prune: true
      secretName: flux-system
  environments:
    - name: uat
      cluster:
        server: https://kubernetes.default.svc
      transforms:
        - type: replace
          from: test.example.com
          to: uat.example.com
    - name: prod
      cluster:
        server: https://kubernetes.default.svc
      transforms:
        - type: replace
          from: test.example.com
          to: example.com
        - type: set
          target:
            kinds:
              - Deployment
            names:
              - api
          path: spec.replicas
          value: 3
        - type: set
          target:
            apps:
              - podinfo
          path: values.replicaCount
          value: 2
        - type: storageClass
          map:
            fast: premium
  adopt:
    protectKinds:
      - PersistentVolumeClaim
      - PersistentVolume
      - Namespace
      - CustomResourceDefinition.apiextensions.k8s.io
