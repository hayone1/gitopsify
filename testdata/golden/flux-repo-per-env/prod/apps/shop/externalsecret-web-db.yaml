apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-db
  namespace: shop
spec:
  data:
    - remoteRef:
        key: shop/web-db
        property: password
      secretKey: password
    - remoteRef:
        key: shop/web-db
        property: username
      secretKey: username
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    name: web-db
