apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inhouse
  namespace: tools
spec:
  chart:
    spec:
      chart: ./apps/inhouse/charts/inhouse
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  interval: 10m
  releaseName: inhouse
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - name: inhouse-values
      kind: ConfigMap
