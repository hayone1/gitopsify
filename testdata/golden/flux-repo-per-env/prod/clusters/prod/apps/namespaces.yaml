apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
  labels:
    gitopsify.io/wave: w-20
spec:
  dependsOn:
    - name: crds
  interval: 10m
  path: ./apps/namespaces
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
