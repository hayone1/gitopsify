apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: payments
  namespace: flux-system
  labels:
    gitopsify.io/wave: w0
spec:
  dependsOn:
    - name: cluster
  interval: 10m
  path: ./apps/payments
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
