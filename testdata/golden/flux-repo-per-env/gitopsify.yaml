# yaml-language-server: $schema=https://raw.githubusercontent.com/hayone1/gitopsify/main/docs/gitopsify.schema.json
# Generated by gitopsify test. Re-run `gitopsify generate -c gitopsify.yaml` to regenerate.
apiVersion: gitopsify.io/v1alpha1
kind: Migration
metadata:
  name: migration
spec:
  source: {}
  scope:
    includeDependencies: true
    clusterScoped: auto
  helm:
    mode: auto
    repositories:
      podinfo: https://stefanprodan.github.io/podinfo
    resolvers:
      - local
  clean:
    strategy: auto
  grouping:
    by: namespace
  ordering:
    enabled: true
    inferDependencies: true
  secrets:
    strategy: external-secrets
    sops:
      encryptedRegex: ^(data|stringData)$
      decryptionSecret: sops-keys
    sealedSecrets:
      controllerNamespace: kube-system
      controllerName: sealed-secrets-controller
      scope: strict
    externalSecrets:
      apiVersion: external-secrets.io/v1
      storeKind: ClusterSecretStore
      storeName: vault
      keyTemplate: '{{ .Namespace }}/{{ .Name }}'
      propertyPerKey: true
      refreshInterval: 1h
  output:
    tool: flux
    layout: repo-per-env
    repo:
      revision: main
    argocd:
      pattern: app-of-apps
      namespace: argocd
      project: gitopsify
      version: v3.5.6
      autoSync: true
      selfHeal: true
      serverSideApply: true
    flux:
      namespace: flux-system
      interval: 10m
      version: v2.9.6
      prune: true
      secretName: flux-system
  environments:
    - name: uat
      cluster:
        server: https://kubernetes.default.svc
      repoURL: git@github.com:acme/gitops-uat.git
    - name: prod
      cluster:
        server: https://kubernetes.default.svc
      repoURL: git@github.com:acme/gitops-prod.git
      transforms:
        - type: image
          from: 'nginx:'
          to: 'registry.example.com/nginx:'
  adopt:
    protectKinds:
      - PersistentVolumeClaim
      - PersistentVolume
      - Namespace
      - CustomResourceDefinition.apiextensions.k8s.io
