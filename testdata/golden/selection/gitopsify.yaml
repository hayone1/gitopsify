# Generated by gitopsify test. Re-run `gitopsify generate -c gitopsify.yaml` to regenerate.
adopt:
  protectKinds:
  - PersistentVolumeClaim
  - PersistentVolume
  - Namespace
  - CustomResourceDefinition.apiextensions.k8s.io
apiVersion: gitopsify.io/v1alpha1
clean:
  strategy: auto
environments:
- cluster:
    server: https://kubernetes.default.svc
  name: uat
grouping:
  by: namespace
helm:
  mode: auto
  repositories:
    podinfo: https://stefanprodan.github.io/podinfo
  resolvers:
  - local
kind: Migration
ordering:
  enabled: true
  inferDependencies: true
output:
  argocd:
    autoSync: true
    createProject: true
    namespace: argocd
    pattern: app-of-apps
    project: gitopsify
    prune: true
    selfHeal: true
    serverSideApply: true
    version: v3.5.6
  dir: gitops
  flux:
    interval: 10m
    namespace: flux-system
    prune: true
    secretName: flux-system
    version: v2.9.6
  layout: folder-per-env
  repo:
    revision: main
  tool: none
scope:
  clusterScoped: auto
  includeDependencies: true
  resources:
  - deployment/shop/web
secrets:
  externalSecrets:
    apiVersion: external-secrets.io/v1
    keyTemplate: '{{ .Namespace }}/{{ .Name }}'
    propertyPerKey: true
    refreshInterval: 1h
    storeKind: ClusterSecretStore
    storeName: default
  sealedSecrets:
    controllerName: sealed-secrets-controller
    controllerNamespace: kube-system
    scope: strict
  sops:
    decryptionSecret: sops-keys
    encryptedRegex: ^(data|stringData)$
  strategy: skip
source: {}
