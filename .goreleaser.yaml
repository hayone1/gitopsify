# Release builds: archives for every platform, Linux packages and checksums.
# Run locally with: goreleaser release --snapshot --clean
version: 2
project_name: gitopsify

before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh

builds:
  - main: ./cmd/gitopsify
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/hayone1/gitopsify/internal/cli.Version={{ .Version }}
      - -X github.com/hayone1/gitopsify/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/hayone1/gitopsify/internal/cli.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - completions/*

nfpms:
  - package_name: gitopsify
    vendor: gitopsify
    homepage: https://github.com/hayone1/gitopsify
    maintainer: gitopsify maintainers <hayone1@users.noreply.github.com>
    description: Turn what runs in a Kubernetes cluster into a GitOps repository for Argo CD, Flux or plain Kustomize.
    license: Apache-2.0
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    recommends: [git]
    contents:
      - src: completions/gitopsify.bash
        dst: /usr/share/bash-completion/completions/gitopsify
      - src: completions/gitopsify.zsh
        dst: /usr/share/zsh/site-functions/_gitopsify
      - src: completions/gitopsify.fish
        dst: /usr/share/fish/vendor_completions.d/gitopsify.fish

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  prerelease: auto
  footer: |
    Install: `curl -fsSL https://raw.githubusercontent.com/hayone1/gitopsify/main/install.sh | sh`
    (Windows: `irm https://raw.githubusercontent.com/hayone1/gitopsify/main/install.ps1 | iex`)

