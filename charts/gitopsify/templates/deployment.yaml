apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.storage.type "postgres" }}
  # Replicas share PostgreSQL: any of them serves any run.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
  {{- else }}
  # One replica: runs work in this pod and its volume holds their output.
  replicas: 1
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitopsify.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitopsify.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "gitopsify.serverConfig" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gitopsify.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gitopsify
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server, --config, /etc/gitopsify/server.yaml]
          ports:
            - name: http
              containerPort: 8080
          env:
            # git, helm and kubectl keep caches in HOME; the root file system is read-only.
            - name: HOME
              value: /tmp
            - name: GITOPSIFY_SESSION_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "gitopsify.secretName" . }}, key: session-key}
            - name: GITOPSIFY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ include "gitopsify.secretName" . }}, key: oidc-client-secret, optional: true}
            {{- if eq .Values.storage.type "postgres" }}
            - name: GITOPSIFY_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "gitopsify.secretName" .) .Values.storage.postgres.existingSecret }}
                  key: {{ if .Values.storage.postgres.existingSecret }}{{ .Values.storage.postgres.secretKey }}{{ else }}postgres-url{{ end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gitopsify/server.yaml
              subPath: server.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/gitopsify
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gitopsify.fullname" . }}
        - name: data
          {{- if and .Values.persistence.enabled (ne .Values.storage.type "postgres") }}
          persistentVolumeClaim:
            claimName: {{ default (include "gitopsify.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
