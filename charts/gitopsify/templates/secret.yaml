{{- if not .Values.secrets.existingSecret }}
{{- $name := include "gitopsify.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secrets.sessionKey }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "session-key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ default (randAlphaNum 48) $key | b64enc | quote }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | b64enc | quote }}
{{- end }}
