{{- if not .Values.secrets.existingSecret }}
{{- $name := include "gitopsify.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secrets.sessionKey }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "session-key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ default (randAlphaNum 48) $key | b64enc | quote }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | b64enc | quote }}
{{- end }}
{{- /* The database URL has a Secret of its own: secrets.existingSecret
holds the session key and the OIDC client secret only. */}}
{{- if and (eq .Values.storage.type "postgres") (not .Values.storage.postgres.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitopsify.fullname" . }}-postgres
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ required "storage.postgres.url or storage.postgres.existingSecret is required with storage.type: postgres" .Values.storage.postgres.url | b64enc | quote }}
{{- end }}
