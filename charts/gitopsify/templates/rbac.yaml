{{- $reader := and .Values.rbac.clusterReader (not .Values.inCluster.impersonate) }}
{{- if and .Values.rbac.create (or $reader .Values.rbac.impersonate) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
rules:
  {{- if $reader }}
  # A scan reads every kind of object (Secrets included: it decides how they
  # reach Git safely). Nothing is ever written. "*" covers resources, not
  # subresources (no pods/log, pods/exec or nodes/proxy). Not granted when
  # the cluster is read as the signed-in person (inCluster.impersonate).
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch]
  {{- end }}
  {{- if .Values.rbac.impersonate }}
  # Read as the signed-in person (inCluster.impersonate). gitopsify never
  # impersonates system: users or groups, but Kubernetes can't enforce that:
  # treat this ServiceAccount as highly privileged.
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gitopsify.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gitopsify.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
