{{- if and .Values.rbac.create (or .Values.rbac.clusterReader .Values.rbac.impersonate) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
rules:
  {{- if .Values.rbac.clusterReader }}
  # A scan reads every kind of object (Secrets included: it decides how they
  # reach Git safely). Nothing is ever written.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch]
  - nonResourceURLs: ["*"]
    verbs: [get]
  {{- end }}
  {{- if .Values.rbac.impersonate }}
  # Read as the signed-in person (inCluster.impersonate).
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
  - apiGroups: [authentication.k8s.io]
    resources: [userextras/scopes, uids]
    verbs: [impersonate]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gitopsify.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gitopsify.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
