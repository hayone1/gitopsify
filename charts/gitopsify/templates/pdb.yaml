{{- if and (eq .Values.storage.type "postgres") (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gitopsify.fullname" . }}
  labels:
    {{- include "gitopsify.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "gitopsify.selectorLabels" . | nindent 6 }}
{{- end }}
