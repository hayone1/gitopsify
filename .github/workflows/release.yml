name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # "go install github.com/hayone1/gitopsify/cmd/gitopsify@<tag>" refuses
      # modules with replace directives and ignores go.work: it builds with
      # the tagged SDK go.mod requires. The release must be that build, so
      # sdk/ must not have changed since that tag (docs/development.md).
      - name: The release uses the SDK go install gets
        run: |
          if go mod edit -json | jq -e '.Replace // [] | length > 0' >/dev/null; then
            echo "::error::go.mod has replace directives; require a tagged sdk/vX.Y.Z instead"
            exit 1
          fi
          v=$(GOWORK=off go list -m -f '{{.Version}}' github.com/hayone1/gitopsify/sdk)
          if ! git diff --quiet "sdk/$v" HEAD -- sdk/; then
            echo "::error::sdk/ changed since sdk/$v, which go.mod requires; tag a new SDK version and require it first"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: "off"
          # sdk/vX.Y.Z tags can point at the same commit; release this tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # Installs the release just published the way users do, on every platform.
  verify-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITOPSIFY_VERSION: ${{ github.ref_name }}
          GITOPSIFY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          "$GITOPSIFY_INSTALL_DIR/gitopsify" version | grep -F "${GITOPSIFY_VERSION#v}"
          "$GITOPSIFY_INSTALL_DIR/gitopsify" skills list
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITOPSIFY_VERSION: ${{ github.ref_name }}
          GITOPSIFY_INSTALL_DIR: ${{ runner.temp }}\bin
          GITOPSIFY_NO_MODIFY_PATH: "1"
        run: |
          ./install.ps1
          & "$env:GITOPSIFY_INSTALL_DIR\gitopsify.exe" version
          & "$env:GITOPSIFY_INSTALL_DIR\gitopsify.exe" skills list
