name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The golden tests build every generated Kustomization with kubectl,
      # and vendored charts with helm. kustomize's Helm support still calls
      # "helm version -c", which Helm 4 dropped, so these checks use Helm 3.
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      # pkg/iac checks the Terraform it writes with terraform fmt.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # The web UI (ui/, Nuxt), embedded in the binary.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@10.20.0
      - run: make ui
      - run: make lint
      # Bugs vet doesn't catch, and known vulnerabilities in code the binary
      # calls (the weekly run catches new ones).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... && (cd sdk && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...)
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make test
      - run: make build
      # Releases and go install build without go.work: go.sum must be
      # complete for that.
      - run: GOWORK=off go build ./...
      # The chart renders with test values and fails without an OIDC issuer.
      - run: |
          helm lint charts/gitopsify -f charts/gitopsify/ci/test-values.yaml
          helm template t charts/gitopsify -f charts/gitopsify/ci/test-values.yaml >/dev/null
          ! helm template t charts/gitopsify >/dev/null 2>&1

  e2e:
    # Real clusters take ~15 minutes: run on demand and weekly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: make e2e
